  <body>
    <div id="app">
      <header id="topbar">
        <button id="backBtn" class="icon-btn" type="button" data-i18n-aria="aria.back" hidden></button>
        <div id="title" class="title"></div>
        <div id="timer" class="timer" hidden></div>
        <div class="corner">
          <label class="lang-btn" data-i18n-aria="aria.lang"><span id="lang-label">EN</span><select id="lang" data-i18n-aria="aria.lang"></select></label>
          <button id="muteBtn" class="icon-btn" type="button" data-i18n-aria="aria.mute"></button>
          <button id="settingsBtn" class="icon-btn" type="button" data-i18n-aria="aria.settings"></button>
        </div>
      </header>
      <main id="view"></main>
      <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-hidden="true"></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="live" class="sr-only" aria-live="assertive"></div>
    </div>
    <noscript><p style="font: 16px system-ui; padding: 24px">Quack-doku needs JavaScript.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
